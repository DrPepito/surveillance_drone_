[platformio]
src_dir = src

[env]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -std=gnu++17

build_unflags =
    -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.10
    adafruit/Adafruit BusIO @ ^1.16.1
    yoursunny/esp32cam



; ==========================
; ESP32 RECEIVER
; ==========================
[env:esp32_receiver]

build_src_filter =
    -<*>
    +<receiver_drone/>

build_flags =
    ${env.build_flags}
    -DDEVICE_ID=1

upload_port = COM7
monitor_port = COM7

