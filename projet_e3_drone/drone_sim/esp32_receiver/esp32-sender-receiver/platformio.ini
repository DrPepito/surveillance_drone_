[platformio]
src_dir = src

[env]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -std=gnu++17

build_unflags =
    -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.10
    adafruit/Adafruit BusIO @ ^1.16.1
    yoursunny/esp32cam


; ==========================
; ESP32 SENDER
; ==========================
[env:esp32_sender]

build_src_filter =
    -<*>
    +<sender_station/>

build_flags =
    ${env.build_flags}
    -DDEVICE_ID=2

upload_port = COM7
monitor_port = COM7

; ==========================
; ESP32 RECEIVER
; ==========================
[env:esp32_receiver]

build_src_filter =
    -<*>
    +<receiver_drone/>

build_flags =
    ${env.build_flags}
    -DDEVICE_ID=1

upload_port = COM10
monitor_port = COM10

; ==========================
; ESP32-CAM
; ==========================
[env:esp32cam]

board = esp32cam

build_src_filter =
    -<*>
    +<esp32cam/>

build_flags =
    ${env.build_flags}
    -DDEVICE_ID=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

upload_speed = 115200
upload_port  = COM12
monitor_port = COM12